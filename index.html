<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Website latihan HTML CSS JavaScript oleh Subki.">
  <meta name="author" content="Subki">
  <title>My Website</title>
  <link rel="stylesheet" href="css/index.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <nav class="navbar">
      <img src="assets/Logo.png" alt="Logo" class="logo" />
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="#">Portfolio</a></li>
        <li><a href="#message">Message Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="welcome">
      <h2>Hi, Welcome To Our Website</h2>
      <p>Website ini dibuat untuk latihan HTML, CSS, dan JavaScript</p>
      <div class="banner">Image Placeholder</div>
    </section>

    <section class="headquarter">
      <h3>Our Headquarter</h3>
      <div class="hq-circles">
        <div class="circle">Jakarta</div>
        <div class="circle">Bandung</div>
        <div class="circle">Surabaya</div>
      </div>
    </section>

    <section id="message" class="message-us">
      <h3>Message Us</h3>
      <form>
        <label for="name">Nama</label>
        <input type="text" id="name" required />

        <label for="birthdate">Tanggal Lahir</label>
        <input type="date" id="birthdate" required />

        <label>Jenis Kelamin</label>
        <div class="gender-options">
          <label><input type="radio" name="gender" value="Laki-Laki" /> Laki-Laki</label>
          <label><input type="radio" name="gender" value="Perempuan" /> Perempuan</label>
        </div>

        <label for="message">Pesan</label>
        <textarea id="message" required></textarea>

        <button type="submit">Submit</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Created by Subki &copy; 2025</p>
  </footer>
</body>
</html>
